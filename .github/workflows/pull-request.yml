name: manju

on:
  pull_request:
    branches: [ muddebihal ]

concurrency:
  group: pull-request-${{ 54 }}
  cancel-in-progress: true

jobs:
  syntax-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: make install
      - run: make awesome_lint
      - run: make export_markdown
